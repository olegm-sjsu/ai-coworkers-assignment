<title>AI Coworkers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column with a progress strip on top, like a daily study sheet. Colors: Spartan blue and gold. */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #14233a; --quiet: #54657e; --rule: #d6deea;
  --accent: #0055a2; --accent-ink: #ffffff; --accent-soft: #e3edf8; --gold: #b9820f; --gold-soft: #fbf1da;
  --good: #1a7f54; --good-soft: #e0f3ea; --warn: #a85f00; --bad: #b3362b; --bad-soft: #fae7e5;
  --display: "Familjen Grotesk", "Trebuchet MS", sans-serif; --body: "Atkinson Hyperlegible", Verdana, sans-serif; --mono: "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1725; --surface: #172335; --ink: #e8eef7; --quiet: #9fb0c8; --rule: #2c3b52;
  --accent: #6fb1f2; --accent-ink: #08233f; --accent-soft: #1b3350; --gold: #e5b64a; --gold-soft: #3a2f14;
  --good: #58c79a; --good-soft: #16382b; --warn: #e3a64e; --bad: #f08d83; --bad-soft: #43201d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1725; --surface: #172335; --ink: #e8eef7; --quiet: #9fb0c8; --rule: #2c3b52;
  --accent: #6fb1f2; --accent-ink: #08233f; --accent-soft: #1b3350; --gold: #e5b64a; --gold-soft: #3a2f14;
  --good: #58c79a; --good-soft: #16382b; --warn: #e3a64e; --bad: #f08d83; --bad-soft: #43201d; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main, header.top { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
p { margin: 0; } a { color: var(--accent); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
.who { color: var(--quiet); font-size: .9rem; }

nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 24px; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.note { color: var(--quiet); font-size: .92rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 500 1.35rem var(--mono); font-variant-numeric: tabular-nums; }
.stat span { color: var(--quiet); font-size: .8rem; }
.paper { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--quiet); font-size: .85rem; font-family: var(--mono); }
.label { font: 700 .74rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--quiet); }
ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.focus { background: var(--gold-soft); border-radius: 6px; padding: 10px 12px; font-size: .95rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 700 .92rem var(--display); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.star { padding: 6px 10px; font-family: var(--mono); font-weight: 500; }
select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; max-width: 100%; }
label select { display: block; width: 100%; margin-top: 4px; }
.head label select { display: inline-block; width: auto; margin-top: 0; }
textarea { width: 100%; min-height: 150px; resize: vertical; }
textarea.code { font-family: var(--mono); font-size: .9rem; }
details summary { cursor: pointer; font-weight: 700; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score b { font: 500 3rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .82rem; font-weight: 700; background: var(--accent-soft); color: var(--ink); }
.pill.good { background: var(--good-soft); } .pill.warn { background: var(--gold-soft); } .pill.bad { background: var(--bad-soft); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(96px, 190px) 1fr 44px; gap: 10px; align-items: center; font-size: .9rem; }
.bar .track { height: 10px; border-radius: 5px; background: var(--rule); overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .fill.prior { background: var(--quiet); opacity: .55; }
.bar .num { font: .84rem var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font: 700 .76rem var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--quiet); }
th, td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.crit { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: .94rem; }
.mark { font-family: var(--mono); font-weight: 500; }
.mark.m1 { color: var(--good); } .mark.m05 { color: var(--warn); } .mark.m0 { color: var(--bad); }
.quote { color: var(--quiet); font-style: italic; font-size: .88rem; }
.error { background: var(--bad-soft); border-radius: 6px; padding: 10px 12px; }
pre.q { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0; }
@media (max-width: 480px) { .bar { grid-template-columns: 1fr 44px; } .bar .track { grid-column: 1 / -1; grid-row: 2; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease; } }
</style>

<header class="top">
  <div><h1>AI Coworkers</h1><p class="who" id="who">Your daily learning brief and career coach</p></div>
  <nav aria-label="Coworkers">
    <a href="#brief" id="nav-brief">Daily brief</a>
    <a href="#coach" id="nav-coach">Career coach</a>
  </nav>
</header>
<main id="app"><p class="note">Loading your data...</p></main>

<script>/*CORE*/</script>
<script>
const $app = document.getElementById("app");
const state = { view: "brief", db: null, sample: null, canWrite: true, profile: null, briefs: [], briefIndex: 0, feedback: {}, opportunities: null, mastery: {}, sessions: [],
  session: null, lastResult: null, busy: false, error: "", filter: "all", ctl: null, opportunityKey: "" };

// Small DOM helper. All text goes through textContent, so model and feed text can never become markup.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "on") for (const [e, fn] of Object.entries(v)) el.addEventListener(e, fn);

}
const link = (url, text) => /^https?:\/\//.test(url || "") ? h("a", { href: url, target: "_blank", rel: "noopener" }, text) : text;
const pct = (x) => Math.round((Number(x) || 0) * 100);
const today = () => new Date().toISOString().slice(0, 10);
const stat = (value, label) => h("div", { class: "stat" }, h("b", {}, value ?? "n/a"), h("span", {}, label));
const empty = (title, text) => h("div", { class: "paper" }, h("h3", {}, title), h("p", { class: "note" }, text));
const slug = (url) => url.replace(/[^A-Za-z0-9]/g, "-").slice(-180);

async function allDocs(path) { return (await state.db.collection(path).get()).docs.map((d) => d.data()); }

async function load() {
  const [db, sample, user] = await Promise.all(["db", "sample", "user"].map((n) => window.claude ? claude.use(n) : null));
  Object.assign(state, { db, sample });
  if (user) { const can = await user.can("data.write"); state.canWrite = can !== false; }
  if (!db) { state.loadError = "Sign in to Claude to load your briefs and coaching history."; route(); return; }
  try {
    const [profiles, briefs, feedback, opps, mastery, sessions] = await Promise.all([
      allDocs("profile"), allDocs("briefs"), allDocs("feedback"), allDocs("opportunities"), db.doc("mastery/current").get(), allDocs("sessions")]);
    state.profile = profiles[0] || null;
    state.briefs = briefs.sort((a, b) => b.date.localeCompare(a.date));
    state.feedback = Object.fromEntries(feedback.map((f) => [f.url, f]));
    state.opportunities = opps.sort((a, b) => b.date.localeCompare(a.date))[0] || null;
    state.mastery = mastery.exists ? mastery.data().skills : {};
    state.sessions = sessions.sort((a, b) => (b.startedAt || "").localeCompare(a.startedAt || ""));
    const open = state.sessions.find((s) => s.status !== "finished");
    if (open) state.session = open;
    if (state.profile) document.getElementById("who").textContent = `${state.profile.name}, ${state.profile.school}`;
  } catch (e) { state.loadError = "Your data could not be reached. Reload the page to try again."; }
  route();
}

function route() {
  state.view = location.hash === "#coach" ? "coach" : "brief";
  for (const v of ["brief", "coach"]) {
    const nav = document.getElementById("nav-" + v);
    if (v === state.view) nav.setAttribute("aria-current", "page"); else nav.removeAttribute("aria-current");
  }
  render();
}
function render() {
  const scroll = window.scrollY;
  const draft = document.getElementById("answer")?.value;
  $app.replaceChildren(...(state.loadError ? [empty("Nothing to show yet", state.loadError)] : state.view === "brief" ? briefView() : coachView()).filter(Boolean));
  const box = document.getElementById("answer");
  if (box && draft) box.value = draft;
  window.scrollTo(0, scroll);
}

// ---- Daily brief ----

async function saveFeedback(article, change) {
  const url = article.url;
  const next = { url, title: article.title, source: article.source, summary: article.summary, read: false, ...state.feedback[url], ...change, updatedAt: new Date().toISOString() };
  state.feedback[url] = next;
  render();
  try { await state.db.doc("feedback/" + slug(url)).set(next); }
  catch (e) { state.error = "That change was not saved. Check your connection and try again."; render(); }
}

function articleCard(a, index) {
  const fb = state.feedback[a.url] || {};
  const write = state.canWrite;
  return h("article", { class: "paper" },
    h("div", { class: "meta" }, h("span", {}, `${index + 1} of 3`), h("span", {}, a.source), h("span", {}, a.published), h("span", {}, `${a.session_minutes} min today`), h("span", {}, `${a.full_read_minutes} min in full`)),
    h("h3", {}, link(a.url, a.title)),
    h("p", {}, a.summary),
    h("p", { class: "focus" }, h("strong", {}, "Read this part: "), a.focus),
    h("div", {}, h("div", { class: "label" }, "Key insights"), h("ul", {}, a.insights.map((i) => h("li", {}, i)))),
    h("div", {}, h("div", { class: "label" }, "Why this helps your career"), h("p", {}, a.career_fit)),
    h("details", {}, h("summary", {}, "Self-check: " + a.check_question), h("p", {}, a.check_answer),
      h("div", { class: "row" }, h("span", { class: "note" }, "Did you get it?"),
        h("button", { class: fb.check === true ? "on" : "", disabled: !write, on: { click: () => saveFeedback(a, { check: true, read: true }) } }, "Got it"),
        h("button", { class: fb.check === false ? "on" : "", disabled: !write, on: { click: () => saveFeedback(a, { check: false, read: true }) } }, "Missed it"))),
    h("div", { class: "row" },
      h("button", { class: fb.read ? "on" : "", disabled: !write, on: { click: () => saveFeedback(a, { read: !fb.read }) } }, fb.read ? "Read" : "Mark as read"),
      h("span", { class: "note" }, "Rate it:"),
      [1, 2, 3, 4, 5].map((n) => h("button", { class: "star" + (fb.rating === n ? " on" : ""), "aria-label": `Rate ${n} of 5`, "aria-pressed": fb.rating === n ? "true" : "false", disabled: !write, on: { click: () => saveFeedback(a, { rating: n }) } }, n))));
}

function briefView() {
  if (!state.briefs.length) return [empty("No brief yet", "Run the daily-tech-upgrade skill in Claude Code. Your three articles for the day will appear here.")];
  const brief = state.briefs[state.briefIndex];
  const p = CoachCore.briefProgress(state.briefs, Object.values(state.feedback));
  return [
    h("section", {},
      h("div", { class: "head" }, h("h2", {}, brief.theme),
        h("label", { class: "note" }, "Brief from ", h("select", { id: "brief-date", on: { change: (e) => { state.briefIndex = Number(e.target.value); render(); } } }, state.briefs.map((b, i) => h("option", { value: i, selected: i === state.briefIndex }, b.date))))),
      h("p", { class: "note" }, `${brief.session_minutes} minutes in total, including one minute per article for this brief and the self-check.`),
      state.error && h("p", { class: "error" }, state.error)),
    h("section", {}, brief.articles.map(articleCard)),
    h("section", {}, h("h2", {}, "Your learning progress"),
      h("div", { class: "stats" }, stat(`${p.read}/${p.delivered}`, "articles read"), stat(p.streak, "day streak"), stat(p.avg_rating, "average rating"), stat(p.check_rate == null ? null : p.check_rate + "%", "self-checks correct")),
      h("p", { class: "note" }, "Your ratings change tomorrow's ranking the next time the skill runs.")),
  ];
}

// ---- Career coach ----

function llm() {
  return (prompt) => {
    state.ctl = new AbortController();
    return state.sample.json(prompt, { cache: false, signal: state.ctl.signal, modelTier: "default" });
  };
}
const demand = () => state.opportunities?.demand || [];
function errorText(e) {
  const code = e && e.code;
  if (code === "not_granted" || code === "sampling_disabled" || code === "capability_disabled") return "The coach needs permission to use Claude on your account. Allow it from this artifact's permissions menu.";
  if (code === "rate_limited") return "You've reached a usage limit for now. Your session is saved, so try again later.";
  if (code === "session_expired") return "Your sign-in expired. Sign in again and reload this page.";
  if (code === "cancelled") return "";
  if (code === "invalid_json" || code === "bad_reply") return "Claude's reply came back in the wrong format. Try again.";
  return "That request failed. Your session is saved, so try again.";
}
async function persist(session) {
  try { await state.db.doc("sessions/" + session.id).set(JSON.parse(JSON.stringify(session))); }
  catch (e) { state.error = "Your last step was not saved. Check your connection before you continue."; }
}
async function step(fn) {
  if (state.busy) return;
  state.busy = true; state.error = ""; render();
  try { await fn(); } catch (e) { state.error = errorText(e); }
  state.busy = false; render();
}
function startSession() {
  step(async () => {
    const opportunity = state.opportunityKey ? state.opportunities.opportunities[Number(state.opportunityKey)] : null;
    const s = CoachCore.createSession({ id: "s" + Date.now(), profile: state.profile, demand: demand(), storedMastery: state.mastery, size: 4, startedAt: new Date().toISOString(), opportunity });
    state.session = s; state.lastResult = null;
    state.sessions = [s, ...state.sessions];
    await CoachCore.nextQuestion(s, llm(), askedBefore());
    await persist(s);
  });
}
const askedBefore = () => state.sessions.flatMap((s) => (s.items || []).map((i) => i.question));
function submit() {
  const answer = document.getElementById("answer").value;
  step(async () => {
    const s = state.session;
    state.lastResult = await CoachCore.submitAnswer(s, answer, llm());
    state.lastResult.skill = s.current?.skill || s.items.at(-1).skill;
    document.getElementById("answer").value = "";
    await persist(s);
  });
}
function next() { step(async () => { state.lastResult = null; await CoachCore.nextQuestion(state.session, llm(), askedBefore()); await persist(state.session); }); }
function finish() {
  step(async () => {
    const s = state.session;
    await CoachCore.finishSession(s, llm(), state.opportunities.resources || {}, new Date().toISOString());
    state.mastery = s.skills;
    await persist(s);
    await state.db.doc("mastery/current").set({ skills: JSON.parse(JSON.stringify(s.skills)), updatedAt: s.finishedAt });
    state.session = null; state.lastResult = null; state.viewReport = s.id;
  });
}

function readinessPanel() {
  const finished = state.sessions.filter((s) => s.report).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
  const skills = CoachCore.initialMastery(demand(), state.session ? state.session.skills : state.mastery);
  const r = CoachCore.readiness(demand(), skills);
  const rows = demand().map((d) => ({ ...d, ...skills[d.skill] })).sort((a, b) => b.demand - a.demand);
  return h("section", {},
    h("div", { class: "head" }, h("h2", {}, "Career readiness"), h("span", { class: "note" }, `From ${state.opportunities.analyzed} job postings, ${state.opportunities.date}`)),
    h("div", { class: "paper" },
      h("div", { class: "score" }, h("b", { id: "readiness" }, r.score), h("span", {}, "out of 100"), h("span", { class: "pill " + (r.score >= 70 ? "good" : r.score >= 40 ? "warn" : "bad") }, r.level), h("span", { class: "note" }, `${r.coverage}% of market demand has been tested`)),
      finished.length > 0 && h("p", { class: "note" }, "After each session: " + finished.map((s) => s.report.readiness.score).join(", ")),
      h("div", { class: "label" }, "Your skill level, most requested skill first"),
      h("div", { class: "bars" }, rows.map((row) => h("div", { class: "bar" }, h("span", {}, row.skill, h("span", { class: "note" }, ` · ${pct(row.demand)}% of jobs`)), h("div", { class: "track" }, h("div", { class: "fill" + (row.n ? "" : " prior"), style: `width:${pct(row.mastery)}%` })), h("span", { class: "num" }, pct(row.mastery))))),
      h("p", { class: "note" }, "Grey bars are starting estimates that you haven't been tested on yet.")));
}

function sessionPanel() {
  const s = state.session;
  const r = state.lastResult;
  if (!state.sample) return h("section", {}, empty("The coach needs Claude", "Open this page in Claude while signed in to run a coaching session."));
  if (!s) return h("section", {}, h("h2", {}, "Coaching session"),
    h("div", { class: "paper" },
      h("p", {}, "Four questions on the skills that matter most for your goal. Each one is a concept, coding, or scenario question. Partial answers get a follow-up."),
      h("label", { class: "note" }, "Prepare for ", h("select", { id: "opportunity", on: { change: (e) => { state.opportunityKey = e.target.value; } } }, h("option", { value: "" }, "Your overall career goal"), state.opportunities.opportunities.map((o, i) => h("option", { value: i, selected: String(i) === state.opportunityKey }, `${o.title} at ${o.org}`)))),
      h("div", { class: "row" }, h("button", { class: "primary", id: "start", disabled: state.busy || !state.canWrite, on: { click: startSession } }, state.busy ? "Writing your first question..." : "Start session")),
      h("p", { class: "note" }, "Each question and grade uses your Claude plan's usage. A session takes 9 to 13 requests."),
      state.error && h("p", { class: "error" }, state.error)));
  const q = s.current;
  const answered = s.items.length + (q ? 1 : 0);
  return h("section", { id: "session" }, h("div", { class: "head" }, h("h2", {}, `Question ${Math.max(answered, 1)} of ${s.size}`), h("span", { class: "note" }, s.goal)),
    r && gradeCard(r),
    q && h("div", { class: "paper" },
      h("div", { class: "meta" }, h("span", {}, q.skill), h("span", {}, q.type), h("span", {}, q.difficulty), q.depth > 0 && h("span", {}, "follow-up")),
      h("pre", { class: "q", id: "question" }, q.prompt),
      h("label", { class: "label", for: "answer" }, "Your answer"),
      h("textarea", { id: "answer", class: q.type === "coding" ? "code" : "", placeholder: q.type === "coding" ? "Write code or pseudocode, and say why it works." : "Answer in your own words, the way you would in an interview." }),
      h("div", { class: "row" },
        h("button", { class: "primary", id: "submit", disabled: state.busy, on: { click: submit } }, state.busy ? "Grading..." : "Submit answer"),
        state.busy && h("button", { on: { click: () => state.ctl?.abort() } }, "Stop"))),
    !q && h("div", { class: "row" },
      s.status === "ready_to_finish"
        ? h("button", { class: "primary", id: "finish", disabled: state.busy, on: { click: finish } }, state.busy ? "Writing your report..." : "Finish and see report")
        : h("button", { class: "primary", id: "next", disabled: state.busy, on: { click: next } }, state.busy ? "Writing the next question..." : "Next question")),
    state.error && h("p", { class: "error" }, state.error));
}

function gradeCard(r) {
  return h("div", { class: "paper", id: "grade" },
    h("div", { class: "score" }, h("b", { style: "font-size:2rem" }, pct(r.score)), h("span", { class: "note" }, "out of 100 on your last answer")),
    r.criteria.map((c) => h("div", { class: "crit" }, h("span", { class: "mark " + (c.met === 1 ? "m1" : c.met === 0.5 ? "m05" : "m0") }, c.met === 1 ? "yes" : c.met === 0.5 ? "part" : "no"), h("div", {}, c.criterion, c.evidence && h("div", { class: "quote" }, `"${c.evidence}"`)))),
    h("p", {}, r.feedback),

function opportunitiesPanel() {
  const o = state.opportunities;
  const all = [...o.opportunities, ...o.research, ...o.ventures];
  const kinds = [["all", "All"], ["internship", "Internships"], ["job", "Jobs"], ["research", "Research"], ["entrepreneurship", "Startups"]];
  const shown = all.filter((x) => state.filter === "all" || x.kind === state.filter);

function coachView() {
  if (!state.profile || !state.opportunities) return [empty("No career data yet", "Run the career-coach-research skill in Claude Code. Your opportunities and skill demand will appear here.")];
  const finished = state.sessions.filter((s) => s.report);

  return [readinessPanel(), sessionPanel(), latest && !state.session && reportView(latest), opportunitiesPanel()];
